# Build, typecheck and test on every push and merge request. Releases for HACS are made on GitHub
# (the push mirror) by .github/workflows/release.yml when a version tag arrives.

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# GitLab's secret detection (free): flags keys or tokens committed by mistake.
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

default:
  image: node:24-bookworm-slim
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

build:
  stage: build
  script:
    - npm run build
    - test -s dist/pecklist-card.js
  artifacts:
    paths:
      - dist/pecklist-card.js
    expire_in: 1 week

lint:
  stage: test
  script:
    - npm run lint

test:
  stage: test
  script:
    - npm test

# The template's job runs in GitLab's analyzer image: none of the npm setup above.
secret_detection:
  before_script: []
  cache: []
