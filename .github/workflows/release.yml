# The GitHub repository is a one-way mirror of GitLab, where this card is developed. HACS installs
# from GitHub releases, so when a version tag arrives (plain x.y.z, matching package.json) this
# builds the card from that tag and publishes the release with pecklist-card.js attached, plus
# build provenance for the file.
name: Release

on:
    push:
        tags:
            - '[0-9]+.[0-9]+.[0-9]+'

jobs:
    release:
        if: github.repository == 'KillSwitchIO/pecklist-card'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Use Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Check the tag matches package.json
              env:
                  TAG: ${{ github.ref_name }}
              run: test "$(jq -r .version package.json)" = "$TAG"

            - name: Build, lint and test
              run: |
                  npm ci
                  npm run lint
                  npm test
                  npm run build

            - name: Attest build provenance
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
              with:
                  subject-path: dist/pecklist-card.js

            - name: Publish the release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  set -eu
                  notes="Changes: https://gitlab.com/killswitch10/pecklist-card/-/blob/$TAG/CHANGELOG.md. Developed on GitLab: https://gitlab.com/killswitch10/pecklist-card"
                  gh release create "$TAG" --repo "$REPOSITORY" --title "$TAG" --notes "$notes" --verify-tag \
                    dist/pecklist-card.js
